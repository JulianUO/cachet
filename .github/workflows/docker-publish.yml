name: Docker publish

on:
  push:
    branches:
      - '3.x'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override with repo variable DOCKERHUB_REPOSITORY (e.g. myuser/cachet).
  DEFAULT_IMAGE_NAME: cachet

jobs:
  secret-scan:
    name: Secret scan (gate)
    uses: ./.github/workflows/secret-scan.yml

  build:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
    runs-on: ubuntu-latest
    needs: secret-scan
    # Push only outside PRs, and only when Docker Hub credentials are configured.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to push
        id: meta_env
        run: |
          set -euo pipefail
          PUSH=false
          if [ "${{ github.event_name }}" != "pull_request" ] \
            && [ -n "${DOCKERHUB_USERNAME:-}" ] \
            && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            PUSH=true
          fi
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ vars.DOCKERHUB_REPOSITORY }}" ]; then
            IMAGE="${{ vars.DOCKERHUB_REPOSITORY }}"
          elif [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            IMAGE="${DOCKERHUB_USERNAME}/${DEFAULT_IMAGE_NAME}"
          else
            IMAGE="local/${DEFAULT_IMAGE_NAME}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE} (push=${PUSH})"

      - name: Log in to Docker Hub
        if: steps.meta_env.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta_env.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/3.x' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.meta_env.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Skip push notice
        if: steps.meta_env.outputs.push != 'true'
        run: |
          echo "Built image tags locally in CI without pushing."
          echo "To enable Docker Hub pushes, add repository secrets:"
          echo "  DOCKERHUB_USERNAME"
          echo "  DOCKERHUB_TOKEN"
          echo "Optional repository variable: DOCKERHUB_REPOSITORY (default: \$DOCKERHUB_USERNAME/cachet)"
