name: Secret scan

on:
  workflow_call:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.24.3'
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Current tree is the deployable surface. Full-history scans fail on
      # decade-old upstream demo keys that no longer exist in HEAD.
      - name: Scan working tree for secrets
        run: |
          set -euo pipefail
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1

      - name: Scan commits introduced by this pull request
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --verbose \
            --redact \
            --exit-code 1

      - name: Scan commits in this push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --log-opts="-n 30" \
              --verbose \
              --redact \
              --exit-code 1
          else
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --log-opts="${BEFORE}..${{ github.sha }}" \
              --verbose \
              --redact \
              --exit-code 1
          fi
